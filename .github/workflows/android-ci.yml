name: Android verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create non-production Firebase client config
        run: |
          mkdir -p app
          printf '%s\n' '{"project_info":{"project_number":"1234567890","project_id":"demo-sleep-tracker-ci","storage_bucket":"demo-sleep-tracker-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0000000000000000","android_client_info":{"package_name":"com.example.sleeptrackersimulator"}},"api_key":[{"current_key":"not-a-real-key"}]}],"configuration_version":"1"}' > app/google-services.json
      - run: chmod +x gradlew
      - name: Build and verify both Android apps
        run: ./gradlew :app:testDebugUnitTest :virtualsleepband:testDebugUnitTest :app:assembleDebug :app:assembleRelease :virtualsleepband:assembleDebug :virtualsleepband:assembleRelease :app:lintDebug :app:lintVitalRelease :virtualsleepband:lintDebug :virtualsleepband:lintVitalRelease --stacktrace
      - name: Prepare release-candidate artifacts
        run: |
          mkdir -p rc-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk rc-artifacts/SleepSense-2.0-RC-debug.apk
          cp virtualsleepband/build/outputs/apk/debug/virtualsleepband-debug.apk rc-artifacts/VirtualSleepBand-RC-debug.apk
          cd rc-artifacts
          sha256sum SleepSense-2.0-RC-debug.apk VirtualSleepBand-RC-debug.apk > SHA256SUMS.txt
      - name: Upload SleepSense RC APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepSense-2.0-RC-debug
          path: rc-artifacts/SleepSense-2.0-RC-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload VirtualSleepBand RC APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSleepBand-RC-debug
          path: rc-artifacts/VirtualSleepBand-RC-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload consolidated RC package
        uses: actions/upload-artifact@v4
        with:
          name: SleepSense-2.0-RC-package
          path: rc-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            virtualsleepband/build/reports/


  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - run: npm ci --prefix firebase-tests
      - run: npx --yes firebase-tools@14.24.2 emulators:exec --project demo-sleep-tracker-rules --only database "npm --prefix firebase-tests test"
