name: Android verification

on:
  pull_request:
  push:
    branches: ["release/labs-1-7-verified"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - run: npm ci --prefix firebase-tests
      - run: npx --yes firebase-tools@14.24.2 emulators:exec --project demo-sleep-tracker-rules --only database "npm --prefix firebase-tests test"
