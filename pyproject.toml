[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepsense-data-pipeline"
version = "2.0.0"
description = "Reproducible Data Engineering and Multimodal Machine Learning Pipelines for SleepSense 2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SleepSense Engineering Team" }]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "pandera>=0.20.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.4.0",
    "tensorflow-cpu>=2.15.0",
    "mlflow>=2.10.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sleepsense-pipeline = "pipelines.cli.main:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml"]
python_files = ["test_*.py"]
pythonpath = ["."]
